services:
  - type: web
    name: feedbackhub
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: feedbackhub-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/feedbackhub.sqlite3
      - key: PYTHON_VERSION
        value: 3.12.8
